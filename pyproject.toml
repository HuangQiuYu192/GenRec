[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "genrec"
version = "0.1.0"
description = "Modular generative recommendation benchmark"
requires-python = ">=3.9"
dependencies = ["torch>=2.0", "PyYAML>=6.0", "transformers>=4.40", "sentencepiece>=0.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["genrec*"]
